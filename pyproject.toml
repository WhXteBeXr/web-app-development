[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"Project/**/*.py" = ["RUF001", "RUF002", "RUF003"]
"lab*/demo.py" = ["RUF001", "RUF002", "RUF003"]
"**/migrations/*.py" = ["RUF012"]
